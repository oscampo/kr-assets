name: Build-My-Page

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'img/**/*.png'
      - 'img/**/*.jpg'
      - 'img/**/*.jpeg'
      - 'img/**/*.gif'
      - 'img/**/*.svg'
      - 'img/**/*.mp4'
      # ... (resto de tus ignorados) ...
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 🟢 PASO EXTRA RECOMENDADO:
      # Esto asegura que GitHub no trate de "procesar" tu sitio con Jekyll.
      # Es vital si usas carpetas que inician con "_" o solo quieres servir HTML puro.
      - name: Disable Jekyll
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
